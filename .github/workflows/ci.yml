name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MSRV: "1.89"

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-make
      - uses: Swatinem/rust-cache@v2

      - name: Cargo check
        run: cargo check --locked --workspace --examples --tests

      - name: Cargo test
        run: cargo test --locked --workspace

      - name: Clippy check
        run: cargo clippy --workspace --all-targets --lib --bins --tests --benches --examples

      - name: "Cargo fmt"
        run: cargo make format-check

      - name: Docs
        env:
          RUSTDOCFLAGS: --cfg docsrs
        run: cargo doc --workspace --all-features --no-deps --document-private-items

  msrv:
    name: Minimal Supported Rust Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}
      - uses: Swatinem/rust-cache@v2
      - name: Check MSRV
        run: cargo +$MSRV check --workspace --all-targets

  minimal-versions:
    name: Minimal Direct Dependency Versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve direct deps to minimum versions
        run: cargo +nightly -Z direct-minimal-versions update
      - name: Check lib at minimum versions
        run: cargo check --lib --locked

  cargo-deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --workspace --all-features
          command-arguments: "-Dwarnings"
