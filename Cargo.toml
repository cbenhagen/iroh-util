[package]
name = "iroh-util"
version = "0.3.1"
edition = "2024"
description = "Utilities for iroh"
license = "MIT OR Apache-2.0"
repository = "https://github.com/n0-computer/iroh-util"
authors = ["n0 team"]
documentation = "https://docs.rs/iroh-util"
keywords = ["iroh", "p2p", "quic", "connection-pool"]
categories = ["network-programming"]
readme = "README.md"
rust-version = "1.89"
exclude = [
    "Cargo.toml.orig",
    ".github",
    ".gitignore",
    "Makefile.toml",
    "cliff.toml",
]

[dependencies]
derive_more = { version = "2.1.1", features = ["debug"] }
iroh = { version = "0.98", default-features = false }
n0-error = "0.1.3"
n0-future = "0.3.2"
tokio = { version = "1.48.0", features = ["sync"] }
tracing = "0.1.41"

[dev-dependencies]
iroh = { version = "0.98", features = ["address-lookup-mdns"] }
n0-tracing-test = "0.3.0"
testresult = "0.4.1"
tokio = { version = "1.48.0", features = ["full"] }
